name: Publish to Registry

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  process-issue:
    if: >
      contains(github.event.issue.labels.*.name, 'app-submission') ||
      contains(github.event.issue.labels.*.name, 'review-submission') ||
      contains(github.event.issue.title, '[App Submission]') ||
      contains(github.event.issue.title, '[Review Submission]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process App or Review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const match = issue.body.match(/json\s*([\s\S]*?)\s*```/);
            if (!match) return;

            const data = JSON.parse(match[1]);
            const isReview = issue.title.includes('[Review Submission]') || issue.labels.some(l => l.name === 'review-submission');

            if (isReview) {
              // Write to reviews.json
              let reviews = {};
              if (fs.existsSync('reviews.json')) {
                try { reviews = JSON.parse(fs.readFileSync('reviews.json', 'utf8')); } catch(e){}
              }
              if (!reviews[data.appId]) reviews[data.appId] = [];
              reviews[data.appId].unshift(data);
              fs.writeFileSync('reviews.json', JSON.stringify(reviews, null, 2));

              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Review for \`${data.appId}\` added to reviews.json.`
              });
            } else {
              // Write to registry.json and apps/
              fs.mkdirSync('apps', { recursive: true });
              fs.writeFileSync(`apps/${data.id}.json`, JSON.stringify(data, null, 2));

              let registry = [];
              if (fs.existsSync('registry.json')) {
                try { registry = JSON.parse(fs.readFileSync('registry.json', 'utf8')); } catch(e){}
              }
              const idx = registry.findIndex(a => a.id === data.id);
              if (idx >= 0) registry[idx] = data; else registry.push(data);
              fs.writeFileSync('registry.json', JSON.stringify(registry, null, 2));

              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ \`${data.name}\` published to registry.json.`
              });
            }

            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });

      - name: Commit and Push
        run: |
          git config --global user.name "Clover Bot"
          git config --global user.email "bot@woodsstudio.dev"
          git add apps/ registry.json reviews.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update from issue #${{ github.event.issue.number }}" && git push)
